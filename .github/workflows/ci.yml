# Official package mirror CI — LLVM 22 via ghcr.io/li-langverse/lic-ci:ubuntu24-llvm22
name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/li-langverse/lic-ci:ubuntu24-llvm22
    env:
      LLVM_DIR: /usr/lib/llvm-22/lib/cmake/llvm
      CC: clang-22
      CXX: clang++-22
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: 65953d0922e0a43c67cf2abb731710accd8e3523

      - uses: actions/checkout@v4
        with:
          repository: li-langverse/li-toml
          path: li-toml
          ref: cursor/li-toml-config-migration

      - name: Build lic
        working-directory: lic
        run: |
          chmod +x scripts/build.sh 2>/dev/null || true
          ./scripts/build.sh

      - name: lic build (li-net-httpd @ pin)
        working-directory: lic
        shell: bash
        env:
          LIC: ${{ github.workspace }}/lic/build/compiler/lic/lic
          LI_REPO_ROOT: ${{ github.workspace }}/lic
          LI_LINK_RUNTIME_FULL: 1
        run: |
          set -eo pipefail
          test -x "$LIC"
          LEAN_FLAGS=()
          if ! command -v lake >/dev/null 2>&1; then
            LEAN_FLAGS+=(--no-lean-verify)
          fi
          # Mirror lic/scripts/build-li-httpd.sh — lib.li needs --allow-open-vc, not bare check.
          "$LIC" build --allow-open-vc "${LEAN_FLAGS[@]}" \
            packages/li-net-httpd/src/main.li -o /tmp/li-httpd-ci
          "$LIC" build --allow-open-vc --no-lean-verify \
            packages/li-net-httpd/li-tests/smoke/builds.li -o /dev/null

      - name: Config migration gates (A0–D + completion)
        shell: bash
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
          LI_TOML_ROOT: ${{ github.workspace }}/li-toml
          LIC: ${{ github.workspace }}/lic/build/compiler/lic/lic
          LI_HTTPD_ROOT: ${{ github.workspace }}
        run: |
          set -eo pipefail
          ln -sfn "$LI_TOML_ROOT" ../li-toml
          bash scripts/gates/phase-a0-parse-gate.sh
          bash scripts/gates/phase-b1-parity-gate.sh
          bash scripts/gates/phase-b2-serve-gate.sh
          bash scripts/gates/phase-c-retire-c-gate.sh
          bash scripts/gates/phase-d-done-gate.sh

  hosting-matrix-podman-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: 65953d0922e0a43c67cf2abb731710accd8e3523

      - name: Build lic + li-httpd (lic-ci container)
        run: |
          set -eo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/ws" \
            -w /ws/lic \
            -e LLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm \
            -e CC=clang-22 \
            -e CXX=clang++-22 \
            -e LI_REPO_ROOT=/ws/lic \
            -e LI_LINK_RUNTIME_FULL=1 \
            ghcr.io/li-langverse/lic-ci:ubuntu24-llvm22 \
            bash -lc 'chmod +x scripts/build.sh scripts/build-li-httpd.sh; ./scripts/build.sh; ./scripts/build-li-httpd.sh; test -x build/li-httpd'
          mkdir -p build
          cp -f lic/build/li-httpd build/li-httpd
          chmod +x build/li-httpd

      - name: Install Podman and podman-compose
        run: |
          set -eo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman podman-compose curl python3 ca-certificates
          podman --version
          podman compose version 2>/dev/null || podman-compose --version
          podman info

      - name: Hosting-matrix Podman multi-replica smoke
        env:
          LI_HTTPD_PROXY_SNAP: "0"
          LI_HTTPD_PROXY_C: "1"
          PODMAN_COMPOSE_PROVIDER: podman-compose
        run: |
          set -eo pipefail
          chmod +x scripts/hosting-matrix-docker-smoke.sh
          bash scripts/hosting-matrix-docker-smoke.sh

  hosting-matrix-features:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: 65953d0922e0a43c67cf2abb731710accd8e3523

      - name: Build lic + li-httpd (lic-ci container)
        run: |
          set -eo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/ws" \
            -w /ws/lic \
            -e LLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm \
            -e CC=clang-22 \
            -e CXX=clang++-22 \
            -e LI_REPO_ROOT=/ws/lic \
            -e LI_LINK_RUNTIME_FULL=1 \
            ghcr.io/li-langverse/lic-ci:ubuntu24-llvm22 \
            bash -lc 'chmod +x scripts/build.sh scripts/build-li-httpd.sh; ./scripts/build.sh; ./scripts/build-li-httpd.sh; test -x build/li-httpd'
          mkdir -p build
          cp -f lic/build/li-httpd build/li-httpd
          chmod +x build/li-httpd

      - name: Install Node and matrix backend deps
        run: |
          set -eo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl python3 ca-certificates nodejs
          if [[ -f li-tests/hosting-matrix/backends/package.json ]]; then
            ( cd li-tests/hosting-matrix/backends && npm install --no-audit --no-fund )
          fi

      - name: Hosting-matrix smoke + API protocol
        env:
          LI_HTTPD_PROXY_SNAP: "0"
          LI_HTTPD_PROXY_C: "1"
        run: |
          set -eo pipefail
          chmod +x scripts/hosting-matrix-smoke.sh scripts/hosting-matrix-api-protocol.sh
          bash scripts/hosting-matrix-smoke.sh
          bash scripts/hosting-matrix-api-protocol.sh
