# Official package mirror CI — LLVM 22 via ghcr.io/li-langverse/lic-ci:ubuntu24-llvm22
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/li-langverse/lic-ci:ubuntu24-llvm22
    env:
      LLVM_DIR: /usr/lib/llvm-22/lib/cmake/llvm
      CC: clang-22
      CXX: clang++-22
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: 337573217951eee086f529f1f2452b680a28445c

      - name: Build lic
        working-directory: lic
        run: |
          chmod +x scripts/build.sh 2>/dev/null || true
          ./scripts/build.sh

      - name: lic build (li-net-httpd @ pin)
        working-directory: lic
        env:
          LIC: ${{ github.workspace }}/lic/build/compiler/lic/lic
          LI_REPO_ROOT: ${{ github.workspace }}/lic
          LI_LINK_RUNTIME_FULL: 1
        run: |
          set -eo pipefail
          test -x "$LIC"
          LEAN_FLAGS=()
          if ! command -v lake >/dev/null 2>&1; then
            LEAN_FLAGS+=(--no-lean-verify)
          fi
          # Mirror lic/scripts/build-li-httpd.sh — lib.li needs --allow-open-vc, not bare check.
          "$LIC" build --allow-open-vc "${LEAN_FLAGS[@]}" \
            packages/li-net-httpd/src/main.li -o /tmp/li-httpd-ci
          "$LIC" build --allow-open-vc --no-lean-verify \
            packages/li-net-httpd/li-tests/smoke/builds.li -o /dev/null
