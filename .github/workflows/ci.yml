# Official package mirror CI — required for every li-langverse package repo.
# LLVM 22 via ghcr.io/li-langverse/lic-ci:ubuntu24-llvm22
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/li-langverse/lic-ci:ubuntu24-llvm22
    env:
      LLVM_DIR: /usr/lib/llvm-22/lib/cmake/llvm
      CC: clang-22
      CXX: clang++-22
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: 337573217951eee086f529f1f2452b680a28445c

      - name: Mirror matches lic package tree
        run: |
          set -eo pipefail
          diff -q src/lib.li lic/packages/li-net-httpd/src/lib.li
          diff -q src/main.li lic/packages/li-net-httpd/src/main.li

      - name: Build lic
        working-directory: lic
        run: |
          chmod +x scripts/build.sh 2>/dev/null || true
          ./scripts/build.sh

      - name: lic check (workspace package)
        working-directory: lic
        env:
          LIC: ${{ github.workspace }}/lic/build/compiler/lic/lic
          LI_REPO_ROOT: ${{ github.workspace }}/lic
        run: |
          set -eo pipefail
          test -x "$LIC"
          "$LIC" check packages/li-net-httpd/src/lib.li
          if [[ -f li-tests/smoke/builds.li ]]; then
            "$LIC" build li-tests/smoke/builds.li -o /dev/null
          fi
