[server]
listen = "127.0.0.1:39235"
document_root = "../static"

[limits]
rate_limit_rps = 10000
rate_limit_burst = 20000

[upstreams.bun]
peers = ["http://127.0.0.1:39232"]

[routes]
"GET /api/*" = "proxy:bun"
"POST /api/*" = "proxy:bun"
"PUT /api/*" = "proxy:bun"
"PATCH /api/*" = "proxy:bun"
"DELETE /api/*" = "proxy:bun"
"OPTIONS /api/*" = "proxy:bun"
"GET /index.html" = "static"
"GET /assets/**" = "static:assets"
